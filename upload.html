<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree Data Submission with Leaflet & Image Preview</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-z3gLPD7yknf1jNT/u34F4qI2xO2d/L4aOa4/nE5u7q0T2+n36e1JtW1f201/u5k6a7/0000000000000=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 1rem;
        max-width: 480px;
        margin: auto;
        background: #f0fdf4;
      }
      .box-con {
        background: #ffffff;
        padding: 1.5rem;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(22, 101, 52, 0.2);
        margin: 1rem auto;
        max-width: 500px;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
        color: #166534;
      }
      input,
      textarea,
      button {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.25rem;
        border-radius: 0.375rem;
        border: 1.5px solid #4ade80;
        font-size: 1rem;
        outline-offset: 2px;
        transition: border-color 0.3s ease;
      }
      input:focus,
      textarea:focus {
        border-color: #15803d;
      }
      button {
        background-color: #22c55e;
        color: white;
        font-weight: 700;
        cursor: pointer;
        margin-top: 1.5rem;
        border: none;
      }
      button:hover {
        background-color: #16a34a;
      }
      #map {
        height: 300px;
        margin-top: 1rem;
        border-radius: 0.5rem;
        box-shadow: 0 4px 8px rgb(34 197 94 / 0.3);
      }

      /* Upload box styles */
      #uploadBox {
        margin-top: 20px;
        cursor: pointer;
        border: 3px dashed #22c55e;
        border-radius: 0.75rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #22c55e;
        position: relative;
        overflow: hidden;
        height: 200px;
        text-align: center;
      }
      #uploadBox:hover {
        border-color: #16a34a;
      }
      #uploadBox i {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }
      #uploadBox span {
        font-weight: 600;
      }
      #imgPreview {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; /* Use contain to fit the image without cropping */
        border-radius: 0.75rem;
        display: none;
        position: absolute;
        inset: 0;
        margin: auto;
      }

      /* Footer copyright */
      p.footer {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #4b5563;
      }
      p.footer a {
        color: #22c55e;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box-con">
      <h2 style="color: #166534; text-align: center">Submit Tree Data</h2>

      <label for="name">Tree Name *</label>
      <input id="name" type="text" placeholder="Enter tree name" required />

      <label for="scientificName">Scientific Name</label>
      <input id="scientificName" type="text" placeholder="Enter scientific name" />

      <label for="description">Description</label>
      <textarea id="description" rows="3" placeholder="Enter description"></textarea>

      <label for="imageUpload">Upload or Capture Image</label>
      <input id="imageUpload" type="file" accept="image/*" capture="environment" style="display: none" />

      <div id="uploadBox" title="Click to upload or capture image">
        <i id="uploadIcon" class="fas fa-camera"></i>
        <span id="uploadText">Tap to upload or open camera</span>
        <img id="imgPreview" alt="Image Preview" />
      </div>

      <label>Pick Location on Map</label>
      <div id="map"></div>
      <p style="margin-top: 0.5rem; font-weight: 600; color: #166534">
        Selected location:
        <span id="locationDisplay">None</span>
      </p>

      <button id="submitBtn">Submit</button>

      <p class="footer">
        ©
        <a href="https://planetprotectorslk.org/" target="_blank">planetprotectorslk.org</a>
      </p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Elements
      const uploadBox = document.getElementById("uploadBox");
      const fileInput = document.getElementById("imageUpload");
      const imgPreview = document.getElementById("imgPreview");
      const uploadIcon = document.getElementById("uploadIcon");
      const uploadText = document.getElementById("uploadText");
      const locationDisplay = document.getElementById("locationDisplay");

      // Image upload click triggers file input
      uploadBox.addEventListener("click", () => fileInput.click());

      // Show preview on file select
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          imgPreview.src = url;
          imgPreview.style.display = "block";
          uploadIcon.style.display = "none";
          uploadText.style.display = "none";
        } else {
          imgPreview.src = "";
          imgPreview.style.display = "none";
          uploadIcon.style.display = "block";
          uploadText.style.display = "block";
        }
      });

      // Initialize Leaflet map
      let map, marker;
      let selectedLatLng = null;

      function updateLocationDisplay(latlng) {
        if (latlng) {
          locationDisplay.textContent = `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
        } else {
          locationDisplay.textContent = "None";
        }
      }

      function initMap() {
        // Default coordinates for Sri Lanka (Hokandara approximate center for example)
        const defaultLat = 6.879;
        const defaultLng = 79.957;

        map = L.map("map").setView([defaultLat, defaultLng], 12); // Increased zoom for a local area

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap contributors",
        }).addTo(map);

        marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
        selectedLatLng = marker.getLatLng();
        updateLocationDisplay(selectedLatLng);

        marker.on("dragend", () => {
          selectedLatLng = marker.getLatLng();
          updateLocationDisplay(selectedLatLng);
        });

        map.on("click", (e) => {
          selectedLatLng = e.latlng;
          marker.setLatLng(e.latlng);
          updateLocationDisplay(selectedLatLng);
        });

        // Try to get user's current location
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const userLat = position.coords.latitude;
              const userLng = position.coords.longitude;
              const userLocation = L.latLng(userLat, userLng);

              map.setView(userLocation, 15); // Zoom closer to user location
              marker.setLatLng(userLocation);
              selectedLatLng = userLocation;
              updateLocationDisplay(selectedLatLng);
            },
            (error) => {
              console.warn("Geolocation error:", error);
              // Fallback to default view if geolocation fails or is denied
            }
          );
        }
      }

      // Convert image file to base64
      function toBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
        });
      }

      // Submit handler
      async function submitData() {
        const name = document.getElementById("name").value.trim();
        const scientificName = document.getElementById("scientificName").value.trim();
        const description = document.getElementById("description").value.trim();
        const imageFile = fileInput.files[0];

        if (!name) {
          alert("Please enter the tree name.");
          return;
        }
        if (!selectedLatLng) {
          alert("Please select a location on the map.");
          return;
        }

        let imageBase64 = "";
        if (imageFile) {
          // Add a simple size check (e.g., 5MB limit) before converting
          const MAX_FILE_SIZE_MB = 5;
          if (imageFile.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
            alert(`Image file is too large. Please select an image smaller than ${MAX_FILE_SIZE_MB}MB.`);
            return;
          }
          try {
            imageBase64 = await toBase64(imageFile);
          } catch (error) {
            alert("Failed to convert image to Base64. Please try another image.");
            console.error("Base64 conversion error:", error);
            return;
          }
        }

        const data = {
          name,
          scientificName,
          description,
          lat: selectedLatLng.lat,
          lng: selectedLatLng.lng,
          imageBase64,
        };

        // --- IMPORTANT: REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL ---
        const apiUrl = "https://script.google.com/macros/s/AKfycbxN_k2zjNOg6YtZKRRIkS8wuptE1NyF2FDweefG_PTXfiZ_Va5ds8unrK_iyuFdwVIS/exec"; 
        // Example: "";

        document.getElementById("submitBtn").textContent = "Submitting...";
        document.getElementById("submitBtn").disabled = true;

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            mode: "cors", // Ensure CORS mode is enabled
            body: JSON.stringify(data),
            headers: { "Content-Type": "application/json" },
          });

          if (!response.ok) {
            // Check for HTTP errors (e.g., 404, 500)
            const errorText = await response.text();
            throw new Error(`HTTP error! Status: ${response.status}. Response: ${errorText}`);
          }

          const text = await response.text();
          // Google Apps Script usually returns plain text which might need parsing
          let result;
          try {
            result = JSON.parse(text);
          } catch (parseError) {
            // If the response is not valid JSON, treat it as a generic success/failure
            result = { status: "error", message: "Unexpected response from server: " + text };
            if (text.includes("success")) { // Simple check for success string
                result = { status: "success", message: "Data submitted successfully (server message was not JSON)." };
            }
          }
          

          if (result.status === "success") {
            alert("Tree data submitted successfully!");
            // Reset form fields
            document.getElementById("name").value = "";
            document.getElementById("scientificName").value = "";
            document.getElementById("description").value = "";
            fileInput.value = ""; // Clear file input
            imgPreview.src = "";
            imgPreview.style.display = "none";
            uploadIcon.style.display = "block";
            uploadText.style.display = "block";
            // Reset map marker to default or current location
            initMap(); // Re-initialize map to reset marker and location display
          } else {
            alert("Error submitting data: " + result.message);
            console.error("Server error response:", result);
          }
        } catch (error) {
          alert("Failed to submit data. Please check your internet connection and try again. Error: " + error.message);
          console.error("Fetch error:", error);
        } finally {
          document.getElementById("submitBtn").textContent = "Submit";
          document.getElementById("submitBtn").disabled = false;
        }
      }

      document.getElementById("submitBtn").addEventListener("click", submitData);

      window.onload = initMap;
    </script>
  </body>
</html>
